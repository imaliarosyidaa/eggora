<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="./images/favicon_io/site.webmanifest" />
</head>

<body>
  <!---Navigation-->
  <nav class="custom-navbar"></nav>
  <!--End Navigation-->

  <!-- Sidebar Nav -->
  <div id="navSidebar" class="nav-sidebar"></div>

  <!--Hero-->
  <div class="header">
    <div class="header-hero">
      <div class="overlay">
        <div class="header-content">
          <h1 class="slide-in">Chatbot</h1>
          <h4 class="slide-in">
            <span>
              <a href="index.html" class="breadcrumb-link">Home</a>
            </span>
            / Chatbot
          </h4>
        </div>
      </div>
    </div>
    <div class="header-img-page">
      <img src="./assets/images/hero-page.png" alt="" srcset="" />
    </div>
  </div>
  <!--End Hero-->

    <!-- Chatbot -->
  <section>
    <div class="chatbot-container-full">
      <div class="chat-container-full">
        <div class="chat-header">Eggora Assistant</div>
        <div class="chat-box" id="chat-box">
          <div class="message bot">
            Hai! Ada yang bisa saya bantu tentang produk peternakan telur Eggora?
          </div>
        </div>
        <div class="input-area">
          <input type="text" id="user-input" placeholder="Ketik pesan..." />
          <button onclick="sendMessage()">Kirim</button>
        </div>
      </div>
    </div>
  </section>
  <!-- End Chatbot -->

  <!-- Sidebar Cart -->
  <section>
    <div id="cartSidebar" class="cart-sidebar">
      <div class="cart-header">
        <h3>Shopping Cart</h3>
        <span class="close-cart">&times;</span>
      </div>
      <hr />
      <div class="cart-body" id="cartItems"></div>
      <!-- Tombol Checkout -->
      <div class="cart-footer">
        <hr />
        <button id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </section>

  <!--Footer-->
  <footer class="footer"></footer>
  <!--End Footer-->

  <script src="./lib/jquery-4.0.0.min.js"></script>
  <script src="./js/index.js"></script>
  <script src="./js/chatbot.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/sidebar.js"></script>
  <script type="module" src="./js/navbar.js"></script>
  <script type="module" src="./js/footer.js"></script>
  <script src="./js/favorites.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
