<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Eggora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9f3;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        /* =========================
           REGISTER CONTAINER
        ========================= */

        .register-container {
            width: 100%;
            max-width: 1050px;

            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;

            display: grid;
            grid-template-columns: 1.05fr 0.95fr;

            box-shadow:
                0 20px 60px rgba(46, 125, 50, 0.12);
        }


        /* =========================
           LEFT IMAGE
        ========================= */

        .register-image {
            position: relative;
            min-height: 700px;

            background: #80c41c;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .register-image::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 48% 52% 60% 40% /
                         45% 40% 60% 55%;

            top: -100px;
            left: -120px;
        }

        .register-image::after {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            background: rgba(255, 193, 7, 0.12);

            border-radius: 60% 40% 45% 55%;

            bottom: -150px;
            right: -100px;
        }

        .register-image img {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 520px;

            height: auto;

            display: block;

            object-fit: contain;
        }


        /* =========================
           RIGHT FORM
        ========================= */

        .register-form {
            padding: 55px 65px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* =========================
           BRAND
        ========================= */

        .brand {
            margin-bottom: 30px;
        }

        .brand h1 {
            color: #80c41c;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .brand p {
            color: #777;

            font-size: 14px;
            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 48px;

            padding: 0 15px;

            border: 1px solid #e1e5dc;
            border-radius: 11px;

            background: #fafcf8;

            color: #333;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        .form-group input::placeholder {
            color: #a5a5a5;
        }

        .form-group input:focus {
            border-color: #80c41c;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(128, 196, 28, 0.12);
        }


        /* =========================
           TERMS
        ========================= */

        .terms {
            display: flex;
            align-items: flex-start;

            gap: 9px;

            margin: 5px 0 22px;

            color: #777;

            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;

            accent-color: #80c41c;
        }

        .terms a {
            color: #6cab13;

            font-weight: 600;

            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 11px;

            background: #80c41c;

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .register-button:hover {
            background: #70ad17;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(128, 196, 28, 0.25);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #888;

            font-size: 13px;
        }

        .login-link a {
            color: #6cab13;

            font-weight: 700;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            body {
                padding: 20px;
            }

            .register-container {
                grid-template-columns: 1fr;

                max-width: 520px;
            }

            .register-image {
                min-height: 280px;
            }

            .register-image img {
                max-width: 380px;
            }

            .register-form {
                padding: 45px 35px;
            }
        }


        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .register-container {
                border-radius: 20px;
            }

            .register-image {
                min-height: 220px;
            }

            .register-image img {
                max-width: 300px;
            }

            .register-form {
                padding: 35px 25px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .brand h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="register-container">

        <!-- =========================
             LEFT IMAGE
        ========================== -->

        <section class="register-image">

            <img
                src="./assets/images/login-background.png"
                alt="Eggora"
            >

        </section>


        <!-- =========================
             REGISTER FORM
        ========================== -->

        <section class="register-form">

            <div class="brand">

                <h1>Create an Account</h1>

                <p>
                    Bergabung dengan Eggora dan mulai terhubung
                    dengan ekosistem peternakan yang lebih berkelanjutan.
                </p>

            </div>


            <form
                action="/action_register.php"
                method="POST"
            >

                <!-- Nama -->
                <div class="form-group">

                    <label for="fullname">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Buat username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Buat password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm-password">
                        Konfirmasi Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Ulangi password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Terms -->
                <label class="terms">

                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >

                    <span>
                        Saya menyetujui
                        <a href="#">
                            Syarat & Ketentuan
                        </a>
                        dan
                        <a href="#">
                            Kebijakan Privasi
                        </a>
                        Eggora.
                    </span>

                </label>


                <!-- Button -->
                <button
                    type="submit"
                    class="register-button"
                >
                    Buat Akun
                </button>

            </form>


            <div class="login-link">

                Sudah punya akun?

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

    </main>

</body>
</html>
