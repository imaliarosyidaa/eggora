<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="./assets/images/favicon_io/site.webmanifest" />
</head>

<body>
    <main class="auth-container">
        <div class="auth-form reg">
            <a href="index.html">
                <img src="./assets/images/eggora-logo.png" alt="Eggora">
            </a>
            <div class="brand">
                <h1>Create an Account</h1>
                <p>
                    Bergabung dengan Eggora dan mulai terhubung
                    dengan ekosistem peternakan yang lebih berkelanjutan.
                </p>
            </div>
            <form action="/action_auth.php" method="POST">
                <!-- Nama -->
                <div class="form-group">
                    <label for="fullname">
                        Nama Lengkap
                    </label>
                    <input type="text" id="fullname" name="fullname" placeholder="Masukkan nama lengkap"
                        autocomplete="name" required>
                </div>
                <!-- Username -->
                <div class="form-group">
                    <label for="username">
                        Username
                    </label>
                    <input type="text" id="username" name="username" placeholder="Buat username" autocomplete="username"
                        required>
                </div>
                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email"
                        required>
                </div>
                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Buat password"
                        autocomplete="new-password" required>
                </div>
                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">
                        Konfirmasi Password
                    </label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Ulangi password"
                        autocomplete="new-password" required>
                </div>
                <!-- Terms -->
                <label class="options terms">
                    <input type="checkbox" name="terms" required>
                    <span>
                        Saya menyetujui
                        <a href="#">
                            Syarat & Ketentuan
                        </a>
                        dan
                        <a href="#">
                            Kebijakan Privasi
                        </a>
                        Eggora.
                    </span>
                </label>
                <!-- Button -->
                <button type="submit" class="auth-button">
                    Buat Akun
                </button>
            </form>
            <div class="login-link">
                Sudah punya akun?
                <a href="login.html">
                    Login
                </a>
            </div>
        </div>
        <div class="auth-image">f
            <img src="./assets/images/login-background.png" alt="Eggora">
        </div>
    </main>
</body>

</html>
