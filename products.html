<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Products</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="./assets/images/favicon_io/site.webmanifest" />
</head>

<body>
  <!-- Navigation -->
  <nav class="custom-navbar"></nav>

  <!-- Sidebar Nav -->
  <div id="navSidebar" class="nav-sidebar"></div>

  <!--Hero-->
  <div class="header">
    <div class="header-hero">
      <div class="overlay">
        <div class="header-content">
          <h1 class="slide-in">Our Products</h1>
          <h4 class="slide-in">
            <span>
              <a href="index.html" class="breadcrumb-link">Home</a>
            </span>
            / Produk Peternakan Mitra
          </h4>
        </div>
      </div>
    </div>
    <div class="header-img-page">
      <img src="./assets/images/hero-page.png" alt="" srcset="" />
    </div>
  </div>
  <!--End Hero-->

  <!-- Produk -->
  <section id="products">
    <!-- Filter Button (Mobile) -->
    <div id="filterBtn" class="filter-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
        <path d="M3 6h18" />
        <path d="M7 12h10" />
        <path d="M10 18h4" />
      </svg>
      <h4>Filter</h4>
    </div>
    <!-- Sidebar Filter -->
    <aside id="filterSidebar" class="sidebar-filter">
      <div class="sidebar-header">
        <span class="close-sidebar">&times;</span>
        <h3>Filter Kategori</h3>
      </div>
      <div id="filter-content" class="filter-content">
      </div>
    </aside>
    <div class="product-grid" id="productGrid">
      <!-- Produk akan dirender di sini -->
    </div>
    <p class="grid-note">
      Setiap produk menampilkan jejak karbon (kg CO₂e), sertifikasi, dan skor
      ESG peternak mitra. Lihat detail rantai pasok di
      <a href="dashboard.html">Dashboard ESG</a>.
    </p>
  </section>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01" />
  </div>

  <!-- Sidebar Cart -->
  <section>
    <div id="cartSidebar" class="cart-sidebar">
      <div class="cart-header">
        <h3>Shopping Cart</h3>
        <span class="close-cart">&times;</span>
      </div>
      <hr />
      <div class="cart-body" id="cartItems"></div>
      <!-- Tombol Checkout -->
      <div class="cart-footer">
        <hr />
        <button id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </section>

  <!--Footer-->
  <footer class="footer"></footer>

  <!-- Scripts -->
  <script src="./lib/jquery-3.7.1.min.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/index.js"></script>
  <script type="module" src="./js/products.js"></script>
  <script src="./js/sidebar.js"></script>
  <script type="module" src="./js/navbar.js"></script>
  <script type="module" src="./js/footer.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <script>
    const filterBtn = document.getElementById("filterBtn");
    const sidebar = document.getElementById("filterSidebar");
    const closeSidebar = document.querySelector(".close-sidebar");

    filterBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });

    closeSidebar.addEventListener("click", () => {
      sidebar.classList.remove("active");
    });
  </script>
</body>

</html>
