<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Shop Checkout</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="./images/favicon_io/site.webmanifest" />
  </head>
  <body>
    <!---Navigation-->
<nav class="custom-navbar"></nav>
    <!--End Navigation-->

    <!-- Sidebar Nav -->
    <div id="navSidebar" class="nav-sidebar">
      <div class="nav-header">
        <span id="closeNav" class="close-nav">&times;</span>
      </div>
      <div class="nav-body">
        <ul class="sidebar-menu">
          <li><a href="index.html">Home</a></li>
          <hr />
          <li><a href="about.html">About</a></li>
          <hr />
          <li><a href="products.html">Products</a></li>
          <hr />
          <li><a href="contact.html">Contact</a></li>
          <hr />
        </ul>
      </div>
    </div>

    <!--Hero-->
    <div class="header">
      <div class="header-hero">
        <div class="overlay">
          <div class="header-content">
            <h1 class="slide-in">Checkout</h1>
            <h4 class="slide-in">
              <span>
                <a href="index.html" class="breadcrumb-link">Home</a>
              </span>
              / Checkout
            </h4>
          </div>
        </div>
      </div>
      <div class="header-img-page">
        <img src="./assets/images/hero-page.png" alt="" srcset="" />
      </div>
    </div>
    <!--End Hero-->

    <section>
      <div id="contact">
        <div class="contact-row">
          <div class="contact-form">
            <form class="form-card">
              <!-- Name -->
              <div class="form-group">
                <label for="name">Name *</label>
                <input
                  type="text"
                  id="name"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <!-- Company Name -->
              <div class="form-group">
                <label for="company">Company Name (optional)</label>
                <input
                  type="text"
                  id="company"
                  placeholder="Company (optional)"
                />
              </div>

              <!-- Country / Region -->
              <div class="form-group">
                <label for="country">Country / Region *</label>
                <input type="text" id="country" value="Indonesia" readonly />
              </div>

              <!-- Street Address -->
              <div class="form-group">
                <label for="address">Street Address *</label>
                <input
                  type="text"
                  id="address"
                  placeholder="Jl. Contoh No.123"
                  required
                />
              </div>

              <!-- Town / City -->
              <div class="form-group">
                <label for="city">Town / City *</label>
                <input
                  type="text"
                  id="city"
                  placeholder="Masukkan nama kota"
                  required
                />
              </div>

              <!-- Province -->
              <div class="form-group">
                <label for="province">Province *</label>
                <select id="province" required>
                  <option value="">-- Pilih Provinsi --</option>
                  <option value="Aceh">Aceh</option>
                  <option value="Bali">Bali</option>
                  <option value="Banten">Banten</option>
                  <option value="Bengkulu">Bengkulu</option>
                  <option value="DI Yogyakarta">DI Yogyakarta</option>
                  <option value="DKI Jakarta">DKI Jakarta</option>
                  <option value="Gorontalo">Gorontalo</option>
                  <option value="Jambi">Jambi</option>
                  <option value="Jawa Barat">Jawa Barat</option>
                  <option value="Jawa Tengah">Jawa Tengah</option>
                  <option value="Jawa Timur">Jawa Timur</option>
                  <option value="Kalimantan Barat">Kalimantan Barat</option>
                  <option value="Kalimantan Selatan">Kalimantan Selatan</option>
                  <option value="Kalimantan Tengah">Kalimantan Tengah</option>
                  <option value="Kalimantan Timur">Kalimantan Timur</option>
                  <option value="Kalimantan Utara">Kalimantan Utara</option>
                  <option value="Kepulauan Bangka Belitung">
                    Kepulauan Bangka Belitung
                  </option>
                  <option value="Kepulauan Riau">Kepulauan Riau</option>
                  <option value="Lampung">Lampung</option>
                  <option value="Maluku">Maluku</option>
                  <option value="Maluku Utara">Maluku Utara</option>
                  <option value="Nusa Tenggara Barat">
                    Nusa Tenggara Barat
                  </option>
                  <option value="Nusa Tenggara Timur">
                    Nusa Tenggara Timur
                  </option>
                  <option value="Papua">Papua</option>
                  <option value="Papua Barat">Papua Barat</option>
                  <option value="Papua Pegunungan">Papua Pegunungan</option>
                  <option value="Papua Selatan">Papua Selatan</option>
                  <option value="Papua Tengah">Papua Tengah</option>
                  <option value="Riau">Riau</option>
                  <option value="Sulawesi Barat">Sulawesi Barat</option>
                  <option value="Sulawesi Selatan">Sulawesi Selatan</option>
                  <option value="Sulawesi Tengah">Sulawesi Tengah</option>
                  <option value="Sulawesi Tenggara">Sulawesi Tenggara</option>
                  <option value="Sulawesi Utara">Sulawesi Utara</option>
                  <option value="Sumatera Barat">Sumatera Barat</option>
                  <option value="Sumatera Selatan">Sumatera Selatan</option>
                  <option value="Sumatera Utara">Sumatera Utara</option>
                </select>
              </div>

              <!-- Postcode -->
              <div class="form-group">
                <label for="postcode">Postcode / ZIP *</label>
                <input type="text" id="postcode" placeholder="12345" required />
              </div>

              <!-- Phone -->
              <div class="form-group">
                <label for="phone">Phone *</label>
                <input
                  type="tel"
                  id="phone"
                  placeholder="08xxxxxxxxxx"
                  required
                />
              </div>

              <!-- Email -->
              <div class="form-group">
                <label for="email">Email Address *</label>
                <input
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                />
              </div>

              <!-- Order Notes -->
              <div class="form-group">
                <label for="notes">Order Notes (optional)</label>
                <textarea
                  id="notes"
                  rows="3"
                  placeholder="Catatan tambahan..."
                ></textarea>
              </div>

              <button type="submit" class="button-link">Kirim</button>
            </form>
          </div>
          <div class="contact-info">
            <div class="checkout-container">
              <h2>Your order</h2>
              <div class="order-summary" id="orderSummary"></div>

              <div class="payment-warning">
                Sorry, it seems that there are no available payment methods.
                Please contact us if you require assistance or wish to make
                alternate arrangements.
              </div>

              <button class="place-order-btn">Place order</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Sidebar Cart -->
    <section>
      <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
          <h3>Shopping Cart</h3>
          <span class="close-cart">&times;</span>
        </div>
        <hr />
        <div class="cart-body" id="cartItems"></div>
        <!-- Tombol Checkout -->
        <div class="cart-footer">
          <hr />
          <button id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </section>

    <!--Footer-->
    <footer class="footer">
 
    </footer>
    <!--End Footer-->

    <script src="./lib/jquery-4.0.0.min.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/cart.js"></script>
     <script src="./js/sidebar.js"></script>
       <script type="module" src="./js/navbar.js"></script>
  <script type="module" src="./js/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
